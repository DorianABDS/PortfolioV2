services:
  backend:
    build: ./backend
    container_name: portfoliov2-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app:cached
      - /app/node_modules

  frontend:
    build: ./frontend
    container_name: portfoliov2-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
