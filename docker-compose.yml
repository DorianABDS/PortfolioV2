services:
  backend:
    build: ./backend
    container_name: portfoliov2-backend
    ports:
      - "5000:5000"
    environment:
      - CI=true
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app:cached
      - backend_node_modules:/app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && node server.js"

  frontend:
    build: ./frontend
    container_name: portfoliov2-frontend
    ports:
      - "5173:5173"
    environment:
      - CI=true
    depends_on:
      - backend
    volumes:
      - ./frontend:/app:cached
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules: